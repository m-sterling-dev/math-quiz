<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学错题宝典</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            color: #1e293b;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1), 0 8px 10px -6px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <header class="w-full max-w-md text-center py-4">
        <div class="inline-block bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-2">
            🌱 小学生数学提分神器
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-700">数学错题宝典</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">第二单元综合练习 · 科学刷题，轻松通关</p>
    </header>

    <main id="app-container" class="w-full max-w-md flex-1 flex flex-col justify-center my-2">
        
        <!-- ================= 模式选择主页 ================= -->
        <div id="view-home" class="space-y-4">
            <!-- 统计总览卡片 -->
            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-3xl p-6 text-white card-shadow">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold">小朋友，今天也要加油哦！</h2>
                        <p class="text-xs text-emerald-100 mt-0.5">已掌握知识点：<span id="stat-mastered" class="font-bold underline">0</span> 题</p>
                    </div>
                    <div class="bg-white/20 p-3 rounded-2xl text-2xl">
                        🎯
                    </div>
                </div>
                <div class="bg-white/10 rounded-xl p-3 flex justify-around text-center">
                    <div>
                        <div id="stat-total" class="text-lg font-extrabold">0</div>
                        <div class="text-[10px] text-emerald-100">总题库</div>
                    </div>
                    <div class="border-r border-white/20"></div>
                    <div>
                        <div id="stat-pending" class="text-lg font-extrabold text-cyan-200">0</div>
                        <div class="text-[10px] text-emerald-100">待做题</div>
                    </div>
                    <div class="border-r border-white/20"></div>
                    <div>
                        <div id="stat-wrong" class="text-lg font-extrabold text-amber-200">0</div>
                        <div class="text-[10px] text-emerald-100">错题本</div>
                    </div>
                    <div class="border-r border-white/20"></div>
                    <div>
                        <div id="stat-accuracy" class="text-lg font-extrabold">100%</div>
                        <div class="text-[10px] text-emerald-100">正确率</div>
                    </div>
                </div>
            </div>

            <!-- 四大核心模式入口 -->
            <div class="grid grid-cols-2 gap-3.5 pt-2">
                <!-- 顺序练习 -->
                <button onclick="startPractice('sequential')" class="bg-white hover:bg-emerald-50 border-2 border-emerald-100 p-4 rounded-2xl text-left transition-all transform active:scale-95 group card-shadow flex flex-col justify-between h-28">
                    <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg font-bold group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                        📑
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">顺序练习</h3>
                        <p class="text-[10px] text-slate-400">稳扎稳打，逐题通关</p>
                    </div>
                </button>

                <!-- 随机练习 -->
                <button onclick="startPractice('random')" class="bg-white hover:bg-teal-50 border-2 border-teal-100 p-4 rounded-2xl text-left transition-all transform active:scale-95 group card-shadow flex flex-col justify-between h-28">
                    <div class="w-9 h-9 rounded-xl bg-teal-100 text-teal-600 flex items-center justify-center text-lg font-bold group-hover:bg-teal-600 group-hover:text-white transition-colors">
                        🎲
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">随机练习</h3>
                        <p class="text-[10px] text-slate-400">打乱顺序，灵活测试</p>
                    </div>
                </button>

                <!-- 待做题练习 -->
                <button onclick="startPractice('pending')" class="bg-white hover:bg-cyan-50 border-2 border-cyan-100 p-4 rounded-2xl text-left transition-all transform active:scale-95 group card-shadow flex flex-col justify-between h-28 relative">
                    <div id="pending-badge" class="absolute top-3 right-3 bg-cyan-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold hidden">0题</div>
                    <div class="w-9 h-9 rounded-xl bg-cyan-100 text-cyan-600 flex items-center justify-center text-lg font-bold group-hover:bg-cyan-600 group-hover:text-white transition-colors">
                        ⏳
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">待做题库</h3>
                        <p class="text-[10px] text-slate-400">攻克跳过、未做题目</p>
                    </div>
                </button>

                <!-- 错题练习 -->
                <button onclick="startPractice('wrong')" class="bg-white hover:bg-amber-50 border-2 border-amber-100 p-4 rounded-2xl text-left transition-all transform active:scale-95 group card-shadow flex flex-col justify-between h-28 relative">
                    <div id="wrong-badge" class="absolute top-3 right-3 bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold hidden">0题</div>
                    <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg font-bold group-hover:bg-amber-600 group-hover:text-white transition-colors">
                        💡
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">错题练习</h3>
                        <p class="text-[10px] text-slate-400">错题消灭，攻克盲区</p>
                    </div>
                </button>
            </div>

            <!-- 专项练习入口栏 -->
            <button onclick="startPractice('special')" class="w-full bg-white hover:bg-purple-50 border-2 border-purple-100 p-3.5 rounded-2xl text-left transition-all transform active:scale-95 group card-shadow flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg font-bold group-hover:bg-purple-600 group-hover:text-white transition-colors">
                        🧩
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">专项练习</h3>
                        <p class="text-[10px] text-slate-400">按知识点分类精准攻克</p>
                    </div>
                </div>
                <span class="text-xs text-purple-600 font-bold bg-purple-50 px-3 py-1 rounded-full">进入 ➡</span>
            </button>
        </div>

        <!-- ================= 答题面板 ================= -->
        <div id="view-quiz" class="hidden flex flex-col space-y-4">
            <!-- 顶部导航与进度 -->
            <div class="flex items-center justify-between bg-white px-4 py-3 rounded-2xl card-shadow">
                <button onclick="backToHome()" class="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1">
                    ⬅ 返回主页
                </button>
                <div class="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">
                    <span id="current-index">1</span> / <span id="total-index">10</span>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- 题目卡片 -->
            <div class="bg-white rounded-3xl p-6 card-shadow space-y-4 relative">
                <!-- 标签栏 -->
                <div class="flex items-center justify-between">
                    <span id="quiz-tag" class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-3 py-1 rounded-full">填空题</span>
                    <span id="quiz-id" class="text-xs text-slate-400 font-semibold">ID: #01</span>
                </div>

                <!-- 题目内容 -->
                <div id="quiz-question" class="text-base sm:text-lg font-bold text-slate-800 leading-relaxed min-h-[70px]">
                    加载中...
                </div>

                <!-- 选项容器 (选择题) -->
                <div id="options-container" class="space-y-2.5 pt-2"></div>

                <!-- 填空输入容器 (多空独立框) -->
                <div id="input-container" class="pt-2 space-y-3"></div>

                <!-- 提交与翻页/跳过按钮组 -->
                <div class="space-y-2 pt-2">
                    <button id="submit-btn" onclick="submitAnswer()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-95 text-base">
                        提交答案
                    </button>

                    <!-- 上一题 / 跳过按钮栏 -->
                    <div id="nav-action-bar" class="flex gap-2">
                        <button onclick="prevQuestion()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition-all">
                            ⬅ 上一题
                        </button>
                        <button onclick="skipQuestion()" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-2.5 rounded-xl text-xs transition-all border border-amber-200">
                            ⏳ 不会做，先跳过
                        </button>
                    </div>
                </div>

                <!-- 解析与反馈区块 (默认隐藏) -->
                <div id="feedback-panel" class="hidden mt-4 pt-4 border-t border-slate-100 space-y-3">
                    <div id="result-status" class="font-extrabold text-lg flex items-center gap-2"></div>
                    <div class="bg-slate-50 p-3.5 rounded-xl space-y-1.5">
                        <div class="text-xs font-bold text-slate-500">正确答案：</div>
                        <div id="correct-answer-text" class="text-sm font-bold text-emerald-700"></div>
                    </div>
                    <div class="bg-emerald-50/60 p-3.5 rounded-xl space-y-1">
                        <div class="text-xs font-bold text-emerald-800 flex items-
